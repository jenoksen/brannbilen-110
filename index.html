    var base = location.href.split('#')[0];
    history.replaceState(null, '', parts.length ? base + '#' + parts.join(',') : base);

function detectLang(){
  try{
    var h = ((location.hash||'') + ',' + (location.search||'')).toLowerCase();
    for(var i=0;i<LANGS.length;i++){
      if(new RegExp('(^|[#,&?=])'+LANGS[i]+'($|[,&])').test(h)) return LANGS[i];
    }
    var n = (navigator.language || 'no').toLowerCase();
    if(/^(nb|nn|no)/.test(n)) return 'no';
    for(var j=0;j<LANGS.length;j++) if(n.indexOf(LANGS[j])===0) return LANGS[j];
    return 'en';
  }catch(err){ return 'no'; }
}

// stasjonen brannbilen staar paa, eller null
function atFuel(){
  for(var k=0;k<FUEL_ST.length;k++){
    var c=FUEL_ST[k].court;
    if(truck.x>c.x && truck.x<c.x+c.w && truck.y>c.y && truck.y<c.y+c.h) return FUEL_ST[k];
  }
  return null;
}
function nearestFuel(){
  var best=null, bd=1e9;
  for(var k=0;k<FUEL_ST.length;k++){
    var c=FUEL_ST[k].court, cx=c.x+c.w/2, cy=c.y+c.h/2;
    var d=Math.hypot(truck.x-cx, truck.y-cy);
    if(d<bd){ bd=d; best={x:cx, y:cy, d:d}; }
  }
  return best;
}

/* ---------- RNG ---------- */
var rngState = 1;
function srand(s){ rngState = s>>>0 || 1; }
function rnd(){ rngState |= 0; rngState = (rngState + 0x6D2B79F5)|0;
  var t = Math.imul(rngState ^ (rngState>>>15), 1|rngState);
  t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
  return ((t ^ (t>>>14))>>>0)/4294967296; }
function ri(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }

/* ---------- skjerm / skalering ---------- */
var dpr=1, scale=3, viewW=0, viewH=0, cssW=0, cssH=0;

function layout(){ needRedraw=true; lblCache={}; lblKeys=[]; starSpr={};
  dpr = Math.min(window.devicePixelRatio||1, dprCap);
  cssW = window.innerWidth; cssH = window.innerHeight;
  cv.width  = Math.round(cssW*dpr);
  cv.height = Math.round(cssH*dpr);
  // 1 logisk piksel skal vere ca 2-3.5 css-piksler -> heltallsskala i enhetspiksler
  var zoomCss = Math.max(1.6, Math.min(3.6, cssW/235));
  scale = Math.max(2, Math.round(zoomCss*dpr));
  viewW = cv.width/scale; viewH = cv.height/scale;
  ctx.imageSmoothingEnabled = false;

  placeButtons();
}
function placeButtons(){
  var r = Math.max(30, Math.min(46, cssW*0.11));

function inStickZone(x){ return leftHanded ? (x > cssW*0.45) : (x < cssW*0.55); }

/* ---------- inndata ---------- */
var keys = {};
var stick = {active:false, id:-1, cx:0, cy:0, x:0, y:0, dx:0, dy:0, mag:0};
var pointers = new Map();

function hit(b,x,y){ var dx=x-b.x, dy=y-b.y; return dx*dx+dy*dy <= b.r*b.r*1.25; }

cv.addEventListener('pointerdown', function(e){
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  audioWake(); needRedraw=true;
  if(e.pointerType==='touch') touchUI=true;
  var x=e.clientX, y=e.clientY;
  if(hit(btnSound,x,y)){ soundOn=!soundOn; applySound(); pointers.set(e.pointerId,'sound'); return; }
  if(state==='play' && confirmQuit){ confirmClick(x,y); pointers.set(e.pointerId,'ui'); return; }
  if((state==='play'||state==='over') && hit(btnFlip,x,y)){ flipHands(); pointers.set(e.pointerId,'flip'); return; }
  if(state==='play' && hit(btnQuit,x,y)){ askQuit(); pointers.set(e.pointerId,'quit'); return; }
  if(state==='menu'){ menuClick(x,y); pointers.set(e.pointerId,'ui'); return; }
  if(state==='help'){ helpClick(x,y); pointers.set(e.pointerId,'ui'); return; }
  if(state==='about'){ aboutClick(x,y); pointers.set(e.pointerId,'ui'); return; }
  if(state==='over'){ overClick(x,y); pointers.set(e.pointerId,'ui'); return; }
  if(hit(btnAction,x,y)){ toggleMode(); pointers.set(e.pointerId,'action'); return; }
  if(hit(btnSiren,x,y)){ truck.siren=!truck.siren; applySound(); pointers.set(e.pointerId,'siren'); return; }
  if(!stick.active && inStickZone(x)){
    stick.active=true; stick.id=e.pointerId; stick.cx=x; stick.cy=y; stick.x=x; stick.y=y;
    updateStick(); pointers.set(e.pointerId,'stick');
  }
}, {passive:false});

cv.addEventListener('pointermove', function(e){
  if(stick.active && e.pointerId===stick.id){ e.preventDefault(); stick.x=e.clientX; stick.y=e.clientY; updateStick(); }
}, {passive:false});

function endPointer(e){
  if(stick.active && e.pointerId===stick.id){ stick.active=false; stick.dx=0; stick.dy=0; stick.mag=0; }
  pointers.delete(e.pointerId);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', endPointer);
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

function updateStick(){
  var dx = stick.x-stick.cx, dy = stick.y-stick.cy;
  var d = Math.hypot(dx,dy), max = 44;
  if(d > max){ dx = dx/d*max; dy = dy/d*max; d = max; }
  stick.dx=dx; stick.dy=dy; stick.mag = Math.min(1, d/max);
}

window.addEventListener('keydown', function(e){
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0) e.preventDefault();
  audioWake();
  if(!keys[e.code]){
    if(e.code==='Escape'){
      if(state==='play'){ if(confirmQuit) confirmQuit=false; else askQuit(); }
      else if(state==='help'||state==='about') state='menu';
    }
    if(state==='play' && confirmQuit){
      if(e.code==='KeyJ') doQuit();
      if(e.code==='KeyN'||e.code==='Space'||e.code==='Enter') confirmQuit=false;
      keys[e.code]=true; return;
    }
    if(e.code==='Space'||e.code==='Enter'){
      if(state==='menu') startGame(false);
      else if(state==='help'||state==='about') state='menu';
      else if(state==='over') startGame(practice);
      else toggleMode();
    }
    if(e.code==='KeyS' && state==='play'){ truck.siren=!truck.siren; applySound(); }
    if(e.code==='KeyM'){ soundOn=!soundOn; applySound(); }
    if(e.code==='KeyH' && state==='play') flipHands();
  }
  keys[e.code]=true;
});
window.addEventListener('keyup', function(e){ keys[e.code]=false; });
document.addEventListener('visibilitychange', function(){ if(document.hidden){ truck.siren=false; applySound(); } });

function inputVec(){
  var x=0,y=0;
  if(keys['ArrowLeft']||keys['KeyA']) x-=1;
  if(keys['ArrowRight']||keys['KeyD']) x+=1;
  if(keys['ArrowUp']||keys['KeyW']) y-=1;
  if(keys['ArrowDown']) y+=1;
  var m = Math.hypot(x,y);
  if(m>0){ return {x:x/m, y:y/m, mag:1}; }
  if(stick.active && stick.mag>0.18){
    var d = Math.hypot(stick.dx,stick.dy)||1;
    return {x:stick.dx/d, y:stick.dy/d, mag:stick.mag};
  }
  return {x:0,y:0,mag:0};
}

/* ---------- lyd ---------- */
var actx=null, soundOn=true, master=null, noiseBuf=null;
var sirenOsc=null, sirenGain=null, sirenT=0;
var engineOsc=null, engineOsc2=null, engineGain=null, engineFilt=null;
var waterGain=null, waterBP=null, fireGain=null, fireFilt=null;

function makeNoise(){
  var len=Math.floor(actx.sampleRate*1.3), buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0), last=0;
  for(var i=0;i<len;i++){ var w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=w*0.55+last*2.5; }
  return buf;
}
function noiseSource(){ var s=actx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }

function audioWake(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  try{
    var AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx = new AC();
    master = actx.createGain(); master.gain.value = soundOn?0.9:0; master.connect(actx.destination);
    noiseBuf = makeNoise();

    // sirene: to toner som veksler
    sirenGain = actx.createGain(); sirenGain.gain.value=0; sirenGain.connect(master);
    sirenOsc = actx.createOscillator(); sirenOsc.type='square'; sirenOsc.frequency.value=660;
    sirenOsc.connect(sirenGain); sirenOsc.start();

    // motor: dyp sag + firkant gjennom lavpass, styrt av fart
    engineGain = actx.createGain(); engineGain.gain.value=0; engineGain.connect(master);
    engineFilt = actx.createBiquadFilter(); engineFilt.type='lowpass'; engineFilt.frequency.value=400;
    engineFilt.connect(engineGain);
    engineOsc = actx.createOscillator(); engineOsc.type='sawtooth'; engineOsc.frequency.value=48;
    engineOsc2 = actx.createOscillator(); engineOsc2.type='square'; engineOsc2.frequency.value=24;
    engineOsc.connect(engineFilt); engineOsc2.connect(engineFilt);
    engineOsc.start(); engineOsc2.start();

    // vann: stoy gjennom bandpass som sveiper = swoosh
    waterBP = actx.createBiquadFilter(); waterBP.type='bandpass'; waterBP.frequency.value=2400; waterBP.Q.value=0.7;
    waterGain = actx.createGain(); waterGain.gain.value=0;
    var ws = noiseSource(); ws.connect(waterBP); waterBP.connect(waterGain); waterGain.connect(master); ws.start();

    // brann: lavpassfiltrert stoy med tilfeldig knitring
    fireFilt = actx.createBiquadFilter(); fireFilt.type='lowpass'; fireFilt.frequency.value=700;
    fireGain = actx.createGain(); fireGain.gain.value=0;
    var fs = noiseSource(); fs.connect(fireFilt); fireFilt.connect(fireGain); fireGain.connect(master); fs.start();
  }catch(e){ actx=null; }
}

function applySound(){ if(master) master.gain.value = soundOn?0.9:0; }

function audioUpdate(dt){
  if(!actx) return;
  var live = (state==='play' && !confirmQuit);
  // sirene
  if(sirenGain){
    sirenGain.gain.value = (live && truck.siren) ? 0.05 : 0;
    if(live && truck.siren){
      sirenT += dt;
      if(sirenT>0.42){ sirenT=0; sirenOsc.frequency.value = (sirenOsc.frequency.value>750)?620:900; }
    }
  }
  // motor
  if(engineGain){
    var sr = live ? Math.min(1, truck.spd/TRUCK_MAX) : 0;
    var tgt = live ? (0.016 + sr*0.03) : 0;
    engineGain.gain.value += (tgt-engineGain.gain.value)*Math.min(1, dt*8);
    var f = 46 + sr*56;
    engineOsc.frequency.value = f + Math.sin(gameTime*9)*1.5;
    engineOsc2.frequency.value = f*0.5;
    engineFilt.frequency.value = 300 + sr*900;
  }
  // vann
  if(waterGain){
    var wt = (live && truck.spraying) ? 0.08 : 0;
    waterGain.gain.value += (wt-waterGain.gain.value)*Math.min(1, dt*14);
    if(live && truck.spraying) waterBP.frequency.value = 2000 + Math.random()*1500;
  }
  // brann - hoyere jo naermere du star
  if(fireGain){
    var d = live ? nearestFireDist() : 1e9;
    var near = Math.max(0, Math.min(1, (135-d)/115));
    var ft = near*near*0.09*(0.7+Math.random()*0.6);
    fireGain.gain.value += (ft-fireGain.gain.value)*Math.min(1, dt*10);
    if(near>0) fireFilt.frequency.value = 480 + Math.random()*520;
  }
}

function blip(freq, dur, type, vol){
  if(!actx||!soundOn||!master) return;
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.08, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+dur);
}
function sweepDown(){
  if(!actx||!soundOn||!master) return;
  var o=actx.createOscillator(), g=actx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(420, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(70, actx.currentTime+0.9);
  g.gain.setValueAtTime(0.1, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.9);
  o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+0.95);
}
// sint tut fra bil du kjorer paa uten sirene
function horn(){
  if(!actx||!soundOn||!master) return;
  var t=actx.currentTime, g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.07,t+0.03);
  g.gain.setValueAtTime(0.07,t+0.30);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.42);
  g.connect(master);
  var fr=[370,466];
  for(var i=0;i<fr.length;i++){
    var o=actx.createOscillator(); o.type='square'; o.frequency.value=fr[i];
    o.connect(g); o.start(t); o.stop(t+0.45);
  }
}
// alarmsignal naar det starter en ny brann
function alarmSignal(){
  if(!actx||!soundOn||!master) return;
  var t=actx.currentTime;
  for(var i=0;i<4;i++){
    var o=actx.createOscillator(), g=actx.createGain(), st=t+i*0.22;
    o.type='square'; o.frequency.value=(i%2)?760:1010;
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(0.085,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,st+0.19);
    o.connect(g); g.connect(master); o.start(st); o.stop(st+0.2);
  }
}

function clockH(){ return clock*24; }
function phaseNow(){
  var h=clockH();
  if(h>=7 && h<17) return 'dag';
  if(h>=17 && h<20) return 'skumring';
  if(h>=20 || h<5) return 'natt';
  return 'daggry';
}
function clockText(){
  var h=clockH(), hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
// hvor morkt det er naa: 0 = full dag, 1 = full natt
function darkAmount(){
  var h=clockH(), ph=phaseNow();
  if(ph==='dag') return 0;
  if(ph==='natt') return 1;
  if(ph==='skumring') return (h-17)/3;
  return 1-(h-5)/2;                         // daggry
}
function darkColor(){
  var ph=phaseNow();
  if(ph==='skumring') return '#241630';
  if(ph==='daggry')   return '#1c1430';
  return '#04060f';
}

function makeGround(){
  var g = document.createElement('canvas'); g.width=WORLD_W; g.height=WORLD_H;
  var c = g.getContext('2d');

  // fortau pr kvartal
  for(var j=0;j<ROWS;j++) for(var i=0;i<COLS;i++){
    var bx=ROAD+i*(BLOCK_W+ROAD), by=ROAD+j*(BLOCK_H+ROAD);
    c.fillStyle=P.walk; c.fillRect(bx-6,by-6,BLOCK_W+12,BLOCK_H+12);

  }
  // forplass foran brannstasjonen
  var A=STATION.apron;
  c.fillStyle='#9a9aa6'; c.fillRect(A.x, A.y, A.w, A.h);
  c.fillStyle='#888894'; c.fillRect(A.x, A.y+A.h-3, A.w, 3);
  c.fillStyle='#adadb8'; c.fillRect(A.x, A.y, A.w, 2);
  // tre baaser rett foran portene
  c.fillStyle='#eaeaf0';

  }
  c.fillRect(A.x+10, A.y+A.h-8, A.w-20, 1);
  // rod/hvit sperresone mot veien
  for(var hx=A.x; hx<A.x+A.w; hx+=8){
    c.fillStyle = ((hx-A.x)/8|0)%2 ? '#e0e0e8' : '#c83828';
    c.fillRect(hx, A.y+A.h-3, 8, 3);
  }

  // forplass foran bensinstasjonene
  for(var fk=0; fk<FUEL_ST.length; fk++){
    var F=FUEL_ST[fk].court;
    c.fillStyle='#a6a6b0'; c.fillRect(F.x, F.y, F.w, F.h);
    c.fillStyle='#9494a0'; c.fillRect(F.x, F.y+F.h-3, F.w, 3);
    c.fillStyle='#e8c84a';
    c.fillRect(F.x+6, F.y+4, F.w-12, 1);
    c.fillRect(F.x+6, F.y+F.h-9, F.w-12, 1);
  }

  // veier
  c.fillStyle=P.road;
  for(var k=0;k<=COLS;k++) c.fillRect(k*(BLOCK_W+ROAD),0,ROAD,WORLD_H);
  for(var m=0;m<=ROWS;m++) c.fillRect(0,m*(BLOCK_H+ROAD),WORLD_W,ROAD);
  // midtstripe
  c.fillStyle=P.line;
  for(var k2=0;k2<=COLS;k2++){ var x=k2*(BLOCK_W+ROAD)+ROAD/2-1;
    for(var y=4;y<WORLD_H;y+=16) c.fillRect(x,y,2,8); }
  for(var m2=0;m2<=ROWS;m2++){ var y2=m2*(BLOCK_H+ROAD)+ROAD/2-1;
    for(var x2=4;x2<WORLD_W;x2+=16) c.fillRect(x2,y2,8,2); }
  // fotgjengerfelt ved kryss
  c.fillStyle=P.cross;
  for(var k3=0;k3<=COLS;k3++) for(var m3=0;m3<=ROWS;m3++){
    var ix=k3*(BLOCK_W+ROAD), iy=m3*(BLOCK_H+ROAD);
    for(var s=0;s<ROAD;s+=6){
      if(iy>2) c.fillRect(ix+s+1, iy-5, 3, 4);
      if(iy<WORLD_H-ROAD-2) c.fillRect(ix+s+1, iy+ROAD+1, 3, 4);
    }
  }
  // stopplinjer og skilt
  for(var nj=0; nj<NODE_ROWS; nj++) for(var ni=0; ni<NODE_COLS; ni++){
    var N=nodeInfo[nj][ni];
    if(N.type==='none') continue;
    var arms = (N.type==='light') ? [0,1,2,3] : [1,3];
    for(var q=0;q<arms.length;q++){
      c.fillStyle='#e8e8ee';
      if(arms[q]===0) c.fillRect(N.x-STOPD-2, N.y+1, 2, 13);
      if(arms[q]===2) c.fillRect(N.x+STOPD,   N.y-14, 2, 13);
      if(arms[q]===1) c.fillRect(N.x-14, N.y-STOPD-2, 13, 2);
      if(arms[q]===3) c.fillRect(N.x+1,  N.y+STOPD,   13, 2);
    }
    if(N.type==='prio'){
      signYield(c, N.x-16, N.y-15); signYield(c, N.x+16, N.y+21);
      signPrio(c,  N.x-16, N.y+21); signPrio(c,  N.x+16, N.y-15);
    }
  }
  return g;
}
function signYield(c,x,y){
  c.fillStyle='#5a5a66'; c.fillRect(x-1,y,2,5);
  c.fillStyle='#d02020';
  c.beginPath(); c.moveTo(x-5,y-9); c.lineTo(x+5,y-9); c.lineTo(x,y-1); c.closePath(); c.fill();
  c.fillStyle='#f4f4f8';
  c.beginPath(); c.moveTo(x-3,y-8); c.lineTo(x+3,y-8); c.lineTo(x,y-3.5); c.closePath(); c.fill();
}
function signPrio(c,x,y){
  c.fillStyle='#5a5a66'; c.fillRect(x-1,y,2,5);
  c.fillStyle='#f4f4f8';
  c.beginPath(); c.moveTo(x,y-11); c.lineTo(x+5,y-6); c.lineTo(x,y-1); c.lineTo(x-5,y-6); c.closePath(); c.fill();
  c.fillStyle='#ffd23a';
  c.beginPath(); c.moveTo(x,y-9); c.lineTo(x+3,y-6); c.lineTo(x,y-3); c.lineTo(x-3,y-6); c.closePath(); c.fill();
}

function buildingSprite(b){

  var c = s.getContext('2d');
  if(b.station){
    var srh = b.h-WALL_H;
    c.fillStyle='#b8302a'; c.fillRect(0,0,b.w,srh);
    c.fillStyle='#e05a4a'; c.fillRect(0,0,b.w,2); c.fillRect(0,0,2,srh);
    c.fillStyle='#8c1f1a'; c.fillRect(0,srh-3,b.w,3);
    c.fillStyle='#f0f0f4'; c.fillRect(5,5,b.w-10,9);
    c.fillStyle='#b8302a';
    c.font='bold 8px "Courier New", monospace'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('110', b.w/2, 10);
    c.fillStyle='#3878f8'; c.fillRect(5,srh-8,5,3); c.fillRect(b.w-10,srh-8,5,3);
    c.fillStyle='#c0c4cc'; c.fillRect(b.w/2-6,srh-9,12,4);
    c.fillStyle='#8c1f1a'; c.fillRect(0,srh,b.w,WALL_H);
    var n=3, gw=Math.floor((b.w-8-(n-1)*5)/n);
    for(var gi=0; gi<n; gi++){
      var gx=4+gi*(gw+5);
      c.fillStyle='#d8d8e0'; c.fillRect(gx,srh+2,gw,WALL_H-3);
      c.fillStyle='#a8a8b4';
      for(var gy=srh+4; gy<srh+WALL_H-2; gy+=3) c.fillRect(gx,gy,gw,1);
      c.fillStyle='#5a5a66'; c.fillRect(gx,srh+2,gw,1);
    }
    b.sprite = s; return;
  }
  if(b.fuel){
    var frh = b.h-WALL_H;
    c.fillStyle='#2f8a5e'; c.fillRect(0,0,b.w,frh);
    c.fillStyle='#4cc48c'; c.fillRect(0,0,b.w,2); c.fillRect(0,0,2,frh);
    c.fillStyle='#1f6442'; c.fillRect(0,frh-3,b.w,3);
    c.fillStyle='#f4f4f8'; c.fillRect(5,4,b.w-10,9);
    c.fillStyle='#2f8a5e';
    c.font='bold 7px "Courier New", monospace'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(T('signFuel'), b.w/2, 9);
    c.fillStyle='#1f6442'; c.fillRect(0,frh,b.w,WALL_H);
    c.fillStyle=P.glass; c.fillRect(6,frh+3,b.w-24,6);
    c.fillStyle='rgba(255,255,255,0.45)'; c.fillRect(6,frh+3,b.w-24,1);
    c.fillStyle='#6b4a2a'; c.fillRect(b.w-15,frh+2,9,WALL_H-2);
    c.fillStyle='#c8a068'; c.fillRect(b.w-9,frh+7,2,2);
    b.sprite = s; return;
  }
  var col = b.burned ? [P.charred,'#241c26','#4a4050'] : b.col;
  var rh = b.h-WALL_H;
  // tak
  c.fillStyle=col[0]; c.fillRect(0,0,b.w,rh);
  c.fillStyle=col[2]; c.fillRect(0,0,b.w,2); c.fillRect(0,0,2,rh);
  c.fillStyle=col[1]; c.fillRect(0,rh-3,b.w,3);
  // takdetaljer
  c.fillStyle=col[1];
  for(var x=6;x<b.w-8;x+=14) c.fillRect(x,5,4,3);
  c.fillStyle = b.burned ? '#2a2230' : P.steel;
  c.fillRect(b.w-12,rh-14,8,8);
  // fasade
  c.fillStyle=col[1]; c.fillRect(0,rh,b.w,WALL_H);
  c.fillStyle=col[0]; c.fillRect(0,rh,b.w,2);
  // vinduer + dor
  for(var wx=5; wx<b.w-8; wx+=12){
    c.fillStyle = b.burned ? '#140f18' : (((wx+b.w)%24===5)?P.glassDark:P.glass);
    c.fillRect(wx,rh+3,6,5);
    if(!b.burned){ c.fillStyle='rgba(255,255,255,0.45)'; c.fillRect(wx,rh+3,6,1); }
  }
  var dx = Math.floor(b.w/2)-4;
  c.fillStyle = b.burned ? '#0f0b12' : '#6b4a2a';

  c.fillStyle = b.burned ? '#0f0b12' : '#c8a068'; c.fillRect(dx+6,rh+7,2,2);
  b.sprite = s;
}

function makeBuildings(){
  buildings.length=0;
  var st = {x:STATION.bld.x, y:STATION.bld.y, w:STATION.bld.w, h:STATION.bld.h,
            col:ROOFS[0], zones:[], damage:0, burned:false, cooldown:0, station:true, sprite:null};

    var FB=FUEL_ST[fk].bld;
    var fb={x:FB.x, y:FB.y, w:FB.w, h:FB.h, col:ROOFS[3], zones:[], damage:0,
            burned:false, cooldown:0, fuel:true, sprite:null};
    buildingSprite(fb); buildings.push(fb);
  }

  for(var j=0;j<ROWS;j++) for(var i=0;i<COLS;i++){
    if(i===STA_I && j===STA_J) continue;
    var isFuel=false;
    for(var fq=0; fq<FUEL_BLOCKS.length; fq++) if(FUEL_BLOCKS[fq][0]===i && FUEL_BLOCKS[fq][1]===j) isFuel=true;
    if(isFuel) continue;
    var bx=ROAD+i*(BLOCK_W+ROAD), by=ROAD+j*(BLOCK_H+ROAD);
    var split = rnd()<0.55;

    if(split && rnd()<0.5){
      var w1 = Math.floor(BLOCK_W*0.46);
      rects.push([bx+4,by+6,w1,BLOCK_H-12]);
      rects.push([bx+BLOCK_W-w1-4,by+6,w1,BLOCK_H-12]);
    } else if(split){
      var h1 = Math.floor(BLOCK_H*0.44);
      rects.push([bx+6,by+4,BLOCK_W-12,h1]);
      rects.push([bx+6,by+BLOCK_H-h1-4,BLOCK_W-12,h1]);
    } else {
      rects.push([bx+5,by+5,BLOCK_W-10,BLOCK_H-10]);
    }
    for(var r=0;r<rects.length;r++){
      var R = rects[r];
      var b = {x:R[0], y:R[1], w:R[2], h:R[3], col:pick(ROOFS),
               zones:[], damage:0, burned:false, cooldown:0, sprite:null};
      var n = (b.w*b.h > 4200) ? 4 : 3;
      var rh = b.h-WALL_H;
      var slots = [[0.26,0.28],[0.72,0.26],[0.5,0.62],[0.22,0.7],[0.78,0.68]];
      for(var z=0; z<n; z++){
        var sl = slots[z];
        b.zones.push({x: b.x + b.w*sl[0] + (rnd()*6-3), y: b.y + rh*sl[1] + (rnd()*5-2),
                      heat:0, lit:false, out:false, seed:rnd()*10});
      }
      buildingSprite(b);
      buildings.push(b);
    }
  }
  sortedBuildings = buildings.slice().sort(function(a,b){ return a.y-b.y; });
}

function buildNodes(){
  nodeInfo=[];
  for(var j=0;j<NODE_ROWS;j++){
    nodeInfo[j]=[];
    for(var i=0;i<NODE_COLS;i++){
      var isLight=false;
      for(var k=0;k<LIGHTS.length;k++) if(LIGHTS[k][0]===i && LIGHTS[k][1]===j) isLight=true;
      var prio=false;
      for(var m=0;m<PRIO_ROWS.length;m++) if(PRIO_ROWS[m]===j) prio=true;
      nodeInfo[j][i] = {i:i, j:j, x:nodeX(i), y:nodeY(j),
                        type: isLight ? 'light' : (prio ? 'prio' : 'none'),
                        phase: (i*7 + j*11) % LIGHT_CYCLE};
    }
  }
}

// 'g' gronn, 'y' gul, 'r' rod. ew=true for ost/vest-retningen
function lightState(n, ew){
  var t=(gameTime + n.phase) % LIGHT_CYCLE;
  if(ew){ if(t<6.5) return 'g'; if(t<8) return 'y'; return 'r'; }
  if(t<9) return 'r'; if(t<15.5) return 'g'; if(t<17) return 'y'; return 'r';
}

function carDir(c){                     // 0=ost 1=sor 2=vest 3=nord
  if(c.ti>c.fi) return 0;
  if(c.tj>c.fj) return 1;
  if(c.ti<c.fi) return 2;
  return 3;
}
function carPos(c){
  var A=NI(c.fi,c.fj), B=NI(c.ti,c.tj);
  var dx=B.x-A.x, dy=B.y-A.y, L=Math.abs(dx)+Math.abs(dy);
  var t=Math.max(0, Math.min(1, c.s/L));
  c.L=L; c.hx=dx/L; c.hy=dy/L;
  c.x = A.x + dx*t + (-c.hy)*c.lat;
  c.y = A.y + dy*t + ( c.hx)*c.lat;
}
function nextFrom(i,j,pi,pj){
  var o=[];
  if(i>0) o.push([i-1,j]); if(i<COLS) o.push([i+1,j]);
  if(j>0) o.push([i,j-1]); if(j<ROWS) o.push([i,j+1]);
  var f=o.filter(function(n){ return pi===undefined || n[0]!==pi || n[1]!==pj; });
  var q=pick(f.length?f:o);
  return {i:q[0], j:q[1]};
}
function newCar(ai,aj,bi,bj){
  return {fi:ai, fj:aj, ti:bi, tj:bj, s:0, v:0, vmax:23+rnd()*13, lat:LANE, latT:LANE,
          col:pick(CAR_COLORS), committed:false, wait:0, stun:0, hcd:0, mad:0,
          x:0, y:0, hx:1, hy:0, L:1, yield:false, brake:false};
}
function spawnCar(initial){
  for(var t=0;t<26;t++){
    var i=ri(0,COLS), j=ri(0,ROWS);
    var nb=nextFrom(i,j);
    var c=newCar(i,j,nb.i,nb.j);
    c.s = 8 + rnd()*((nb.i!==i ? BLOCK_W : BLOCK_H)*0.75);
    carPos(c);
    var dTruck = Math.hypot(c.x-truck.x, c.y-truck.y);
    if(!initial && dTruck < 170) continue;
    if(dTruck < 24) continue;
    var clear=true;
    for(var k=0;k<cars.length;k++) if(Math.hypot(cars[k].x-c.x, cars[k].y-c.y) < 20) clear=false;
    if(!clear) continue;
    c.v = c.vmax*0.6;
    cars.push(c); return true;
  }
  return false;
}
function despawnFar(){
  for(var k=0;k<cars.length;k++){
    if(Math.hypot(cars[k].x-truck.x, cars[k].y-truck.y) > 230){ cars.splice(k,1); return true; }
  }
  return false;
}
function makeCars(){
  cars.length=0;
  for(var k=0;k<7;k++) spawnCar(true);
}

// avstand til naermeste bil rett foran i samme felt
function gapAhead(c){
  var best=99;
  for(var k=0;k<cars.length;k++){
    var o=cars[k]; if(o===c) continue;
    var rx=o.x-c.x, ry=o.y-c.y;
    var along = rx*c.hx + ry*c.hy;
    if(along<=0.5 || along>46) continue;
    var side = rx*(-c.hy) + ry*c.hx;
    if(side>10 || side<-10) continue;
    if(along<best) best=along;
  }
  return best;
}
// Bare biler som faktisk er inne i selve krysset sperrer. Biler som staar
// og venter ved stopplinja teller ikke - ellers laaser de hverandre for godt.
function intersectionClear(N, me){
  var r=ROAD/2+8;
  for(var k=0;k<cars.length;k++){
    var o=cars[k]; if(o===me) continue;
    var ox=o.x-N.x, oy=o.y-N.y;
    if(ox>r || ox<-r || oy>r || oy<-r) continue;
    if(o.committed) return false;                                // paa vei inn eller gjennom
    if(o.fi===N.i && o.fj===N.j && o.s < ROAD/2+10) return false; // paa vei ut av krysset
  }
  return true;
}
// finnes det bil paa vei inn i krysset fra en av retningene i dirs?
function conflictFrom(N, me, dirs){
  for(var k=0;k<cars.length;k++){
    var o=cars[k]; if(o===me) continue;
    if(o.ti!==N.i || o.tj!==N.j) continue;
    var od=carDir(o), match=false;
    for(var m=0;m<dirs.length;m++) if(dirs[m]===od) match=true;
    if(!match) continue;
    if(o.committed) return true;
    if(o.yield) continue;
    if((o.L-o.s-STOPD) < 30 && o.v > 3) return true;
  }
  return false;
}
function mayEnter(c, gap){
  var N=NI(c.ti,c.tj);
  if(!N) return true;
  if(!intersectionClear(N,c)) return false;
  if(gap < 20) return false;                    // ikke kjor inn i kryss du ikke kommer ut av
  var d=carDir(c), ew=(d===0 || d===2);
  if(N.type==='light'){
    var st=lightState(N, ew);
    if(st==='g') return true;
    if(st==='y') return (c.L-c.s-STOPD) < 6;    // rekker ikke stoppe
    return false;
  }
  if(c.wait > 5) return true;                   // sikkerhetsventil mot vranglaas (gjelder ikke rodt lys)
  if(N.type==='prio'){
    if(ew) return true;                          // forkjorsvei ost/vest
    return !conflictFrom(N, c, [0,2]);           // vikeplikt for forkjorsveien
  }
  return !conflictFrom(N, c, [(d+3)%4]);         // hoyreregel
}

function updateCars(dt){
  var k, c;
  for(k=0;k<cars.length;k++) carPos(cars[k]);
  for(k=0;k<cars.length;k++){
    c=cars[k];
    if(c.hcd>0) c.hcd-=dt;
    if(c.mad>0) c.mad-=dt;
    if(c.stun>0) c.stun-=dt;

    // sirene: bilene viker i god tid, og ekstra tidlig hvis de ligger foran deg
    var sdx=c.x-truck.x, sdy=c.y-truck.y, sd=Math.hypot(sdx,sdy)||0.01;
    var ahead=(sdx*Math.cos(truck.ang) + sdy*Math.sin(truck.ang))/sd;
    c.yield = truck.siren && (sd<110 || (sd<230 && ahead>0.35));

    var dStop = c.L - c.s - STOPD;
    var inInt = (c.L-c.s) < ROAD/2+3 || c.s < ROAD/2+3;
    var vt = c.vmax;
    if(c.stun>0) vt = 0;

    var gap = gapAhead(c);
    if(gap<32) vt = Math.min(vt, Math.max(0, (gap-15))*3.0);

    if(!c.committed){
      if(dStop < -1) c.committed = true;
      else if(dStop < 36){
        if(mayEnter(c, gap)){ if(dStop < 7) c.committed = true; }
        else { vt = Math.min(vt, Math.max(0, dStop*2.2)); c.wait += dt; }
      }
    }
    if(c.yield && !inInt && !c.committed) vt = 0;

    c.latT = c.yield ? 13 : LANE;
    c.lat += Math.max(-13*dt, Math.min(13*dt, c.latT-c.lat));

    c.brake = (vt < c.v-1) || (c.v < 2 && vt < 2);
    var acc = (vt>c.v) ? 24 : 140;   // bremser hardt naar noe dukker opp foran
    c.v += Math.max(-acc*dt, Math.min(acc*dt, vt-c.v));
    if(c.v<0) c.v=0;
    c.s += c.v*dt;

    if(c.s >= c.L){
      var pi=c.fi, pj=c.fj;
      c.s -= c.L; c.fi=c.ti; c.fj=c.tj;
      var nx=nextFrom(c.fi, c.fj, pi, pj);
      c.ti=nx.i; c.tj=nx.j; c.committed=false; c.wait=0;
    }
    if(c.s<0) c.s=0;
    carPos(c);

    // brannbilen dytter - tregt, og den bremser kraftig selv
    var tdx=c.x-truck.x, tdy=c.y-truck.y, td=Math.hypot(tdx,tdy);
    if(td<13 && td>0.01 && state==='play'){
      var ux=tdx/td, uy=tdy/td, overlap=13-td;
      // staar brannbilen fast, skyver den bilene unna mye raskere
      var force = (truck.stuck>=1) ? 6 : 1;
      var mv = Math.min(overlap, (3 + Math.min(1, truck.spd/TRUCK_MAX)*16)*force*dt);
      c.s  += (ux*c.hx + uy*c.hy)*mv;
      c.lat = Math.max(-15, Math.min(15, c.lat + (ux*(-c.hy) + uy*c.hx)*mv));
      if(c.s<0) c.s=0;
      c.stun = 0.7;
      // bilen skyver aldri brannbilen inn i en vegg, og slipper helt taket
      // hvis brannbilen har staatt fast en stund
      var rest = overlap - mv;
      if(rest>0 && truck.stuck<2){
        var nxp=truck.x-ux*rest*0.9, nyp=truck.y-uy*rest*0.9;
        if(!blocked(nxp, truck.y)) truck.x = nxp;
        if(!blocked(truck.x, nyp)) truck.y = nyp;
      }
      truck.spd *= (truck.stuck>=1) ? 0.97 : 0.88;
      if(!truck.siren && truck.spd>8 && c.hcd<=0){ horn(); c.hcd=2.4; c.mad=1.6; }
      carPos(c);
    }
  }
}

function startGame(isPractice){
  practice = !!isPractice;
  srand((Date.now()%100000)|0);
  buildNodes();
  buildFuelStations();
  ground = makeGround();
  makeBuildings(); makeHydrants(); makeCars();
  droplets.length=0; smokes.length=0; steams.length=0; texts.length=0;
  truck = {x: STATION.park.x, y: STATION.park.y, ang: Math.PI/2, spd:0, mode:'drive',
           aim: Math.PI/2, water:TANK_MAX, siren:false, spraying:false, refill:0,
           fuel:FUEL_MAX, fueling:0, stuck:0, mvX:STATION.park.x, mvY:STATION.park.y, mvT:0};
  lowFuel = false; overReason = '';
  clock = 8/24; lastPhase='dag'; crew='dag'; shiftDue=false; shiftAnim=0;
  camX = (viewW>=WORLD_W) ? (WORLD_W-viewW)/2 : Math.max(0, Math.min(WORLD_W-viewW, truck.x-viewW/2));
  camY = (viewH>=WORLD_H) ? (WORLD_H-viewH)/2 : Math.max(0, Math.min(WORLD_H-viewH, truck.y-viewH/2));
  stars=3; score=0; savedCount=0; savedForStar=0;
  fireTimer=4.5; level=1; levelTimer=0; gameTime=0; hint=10; msg=null; shake=0;
  state='play';
  igniteRandom();
  applySound();
}

function askQuit(){
  confirmQuit = true; truck.siren=false; truck.spraying=false;
  blip(420,0.08,'square',0.05);
}
function doQuit(){
  confirmQuit = false; truck.siren=false; state='menu';
  blip(320,0.14,'square',0.05);
}
function toggleMode(){
  if(state!=='play'||confirmQuit) return;
  truck.mode = (truck.mode==='drive') ? 'hose' : 'drive';
  if(truck.mode==='hose'){ truck.spd=0; truck.aim = truck.ang; truck.siren=false; }
  blip(truck.mode==='hose'?520:380, 0.09, 'square', 0.06);
}

/* ---------- brann ---------- */
function igniteRandom(){
  var cand = buildings.filter(function(b){ return !b.station && !b.fuel && !b.burned && b.cooldown<=0 && !isBurning(b); });
  if(!cand.length) return;
  var b = pick(cand);
  var z = pick(b.zones.filter(function(z){return !z.lit;}) || b.zones);
  if(!z) return;
  z.lit=true; z.out=false; z.heat=12;
  msg={t:2.4, text:T('msgFire'), col:'#ff8a3a'};
  alarmSignal();
}
function isBurning(b){
  for(var i=0;i<b.zones.length;i++) if(b.zones[i].lit && !b.zones[i].out) return true;
  return false;
}
function burnDown(b){
  b.burned=true; b.damage=100;
  for(var i=0;i<b.zones.length;i++){ b.zones[i].lit=false; b.zones[i].out=false; b.zones[i].heat=0; }
  buildingSprite(b);
  shake=9; sweepDown();
  for(var s=0;s<26;s++) smokes.push({x:b.x+rnd()*b.w, y:b.y+rnd()*b.h, vx:(rnd()-0.5)*10, vy:-8-rnd()*14, life:2.4, size:3+rnd()*4});
  if(!practice){
    stars--; savedForStar=0; overReason='overStars';
    msg={t:3.2, text:T('msgBurned'), col:'#ff5a4a'};
    if(stars<=0){ stars=0; state='over'; best=Math.max(best,score); truck.siren=false; applySound(); }
  } else {
    msg={t:3.2, text:T('msgBurnedPr'), col:'#ff5a4a'};
  }
}
function saveBuilding(b){
  b.cooldown = SAVE_COOLDOWN;
  score += 200; savedCount++; savedForStar++;
  texts.push({x:b.x+b.w/2, y:b.y+8, t:1.8, s:T('msgSaved','{n}','200'), col:'#8ef08e'});
  blip(740,0.1,'square',0.07); setTimeout(function(){ blip(990,0.16,'square',0.07); },110);
  if(savedForStar>=5 && stars<3){
    stars++; savedForStar=0;
    msg={t:3, text:T('msgStar'), col:'#8ef08e'};
    blip(1180,0.25,'triangle',0.09);
  }
}

/* ---------- oppdatering ---------- */
function update(dt){
  tick++;
  audioUpdate(dt);
  if(state!=='play'){ updateParticles(dt); return; }
  if(confirmQuit){ truck.spraying=false; truck.spd=0; updateParticles(dt); return; }
  gameTime+=dt; if(hint>0) hint-=dt;
  if(msg){ msg.t-=dt; if(msg.t<=0) msg=null; }
  if(shake>0) shake=Math.max(0, shake-dt*22);

  /* --- klokke og vaktbytte --- */
  clock = (clock + dt/DAY_LEN) % 1;
  var ph = phaseNow();
  if(ph !== lastPhase){
    if(ph==='skumring' || ph==='daggry'){
      shiftDue = true;
      msg = {t:3.4, text:T('warnShift'), col:'#ffd23a'};
      blip(520,0.18,'square',0.06);
    }
    lastPhase = ph;
  }
  if(shiftDue && shiftAnim<=0 && atStation() && truck.spd<8){
    shiftAnim = 3.0; truck.mode='drive'; truck.siren=false;
    blip(660,0.12,'square',0.06);
  }

  var inp = inputVec();

  /* --- bil eller slange --- */
  if(shiftAnim>0){
    shiftAnim -= dt;
    truck.spd = 0; truck.spraying = false;
    if(shiftAnim<=0){
      shiftDue = false;
      crew = (crew==='dag') ? 'natt' : 'dag';
      msg = {t:2.8, text: (crew==='dag' ? T('msgDayCrew') : T('msgNightCrew')), col:'#8ef08e'};
      blip(880,0.14,'square',0.07);
    }
  } else if(truck.mode==='drive'){
    truck.spraying=false;
    if(inp.mag>0.15){
      var target = Math.atan2(inp.y, inp.x);
      var diff = ((target-truck.ang+Math.PI*3)%(Math.PI*2))-Math.PI;
      truck.ang += Math.max(-TRUCK_TURN*dt, Math.min(TRUCK_TURN*dt, diff));
      truck.spd = Math.min((truck.fuel>0?TRUCK_MAX:16)*inp.mag, truck.spd + TRUCK_ACC*dt);
    } else {
      truck.spd = Math.max(0, truck.spd - TRUCK_FRIC*60*dt);
    }
    truck.mvT += dt;
    if(truck.mvT >= 1){
      var movedPx = Math.hypot(truck.x-truck.mvX, truck.y-truck.mvY);
      // under 3 px paa et sekund = staar fast, over 6 px = kommer seg fram.
      // Mellomrommet holder telleren i ro saa den ikke veksler fram og tilbake.
      if(inp.mag>0.3 && movedPx < 3) truck.stuck++;
      else if(movedPx > 6) truck.stuck = 0;
      truck.mvX = truck.x; truck.mvY = truck.y; truck.mvT = 0;
    }
    moveTruck(Math.cos(truck.ang)*truck.spd*dt, Math.sin(truck.ang)*truck.spd*dt);
  } else {
    truck.spd=0;
    if(inp.mag>0.2){ truck.aim = Math.atan2(inp.y, inp.x); truck.spraying = truck.water>0 && !shiftDue; }
    else truck.spraying=false;
    if(truck.spraying){
      truck.water = Math.max(0, truck.water - SPRAY_COST*60*dt);
      for(var d=0; d<2; d++){
        var a = truck.aim + (Math.random()-0.5)*0.24;
        var sp = 128 + Math.random()*46;
        droplets.push({x: truck.x+Math.cos(truck.aim)*9, y: truck.y+Math.sin(truck.aim)*9 - 3,
                       vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: HOSE_RANGE/sp});
      }
    }
  }

  /* --- bensin --- */
  truck.fuel = Math.max(0, truck.fuel - (FUEL_IDLE + FUEL_RATE*Math.min(1, truck.spd/TRUCK_MAX))*dt);
  truck.fueling = 0;
  if(atFuel() && truck.fuel < FUEL_MAX){
    truck.fuel = Math.min(FUEL_MAX, truck.fuel + FUEL_FILL*dt);
    truck.fueling = 1;
    if(truck.fuel > 30) lowFuel = false;
  }
  if(!lowFuel && truck.fuel < 30){ lowFuel = true; msg={t:3, text:T('msgLowFuel'), col:'#e8a020'}; blip(300,0.5,'square',0.06); }
  if(truck.fuel <= 0 && !practice){
    overReason = 'overFuel';
    state='over'; best=Math.max(best,score); truck.siren=false; applySound();
    sweepDown();
  }

  /* --- brannpost --- */
  truck.refill=0;
  for(var h=0; h<hydrants.length; h++){
    if(Math.hypot(truck.x-hydrants[h].x, truck.y-hydrants[h].y) < HYDRANT_R){
      if(truck.water < TANK_MAX){ truck.water = Math.min(TANK_MAX, truck.water + REFILL_RATE*dt); truck.refill=1; }
      break;
    }
  }

  /* --- vanndraper --- */
  for(var i=droplets.length-1; i>=0; i--){
    var p = droplets[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx*=0.985; p.vy*=0.985; p.life-=dt;
    var hitZone=false;
    for(var b=0; b<burning.length && !hitZone; b++){
      var B = burning[b];
      for(var z=0; z<B.zones.length; z++){
        var Z = B.zones[z]; if(!Z.lit || Z.out) continue;
        if(Math.abs(p.x-Z.x)<8 && Math.abs(p.y-Z.y)<9){
          Z.heat -= ZONE_COOL;
          steams.push({x:Z.x+(Math.random()-0.5)*8, y:Z.y-4, vy:-16-Math.random()*12, life:0.5});
          if(Z.heat<=0){
            Z.heat=0; Z.out=true; Z.lit=false; score+=60;
            texts.push({x:Z.x, y:Z.y-6, t:1.1, s:'+60', col:'#c8f0ff'});
            blip(620,0.08,'sine',0.06);
            if(!isBurning(B)) saveBuilding(B);
          }
          hitZone=true; break;
        }
      }
    }
    if(hitZone || p.life<=0) droplets.splice(i,1);
  }
  var dmax=Math.round(260*partScale);
  if(droplets.length>dmax) droplets.splice(0, droplets.length-dmax);

  /* --- bygninger og brann --- */
  burning.length = 0;
  for(var k=0; k<buildings.length; k++){
    var B2 = buildings[k];
    if(B2.burned) continue;
    if(B2.cooldown>0){
      B2.cooldown-=dt; B2.damage=Math.max(0, B2.damage - 40*dt/SAVE_COOLDOWN*2);
      if(B2.cooldown<=0){ for(var q=0;q<B2.zones.length;q++){ B2.zones[q].out=false; B2.zones[q].heat=0; } B2.damage=0; }
      continue;
    }
    var isBurn=false, hottest=0;
    for(var z2=0; z2<B2.zones.length; z2++){
      var Z2=B2.zones[z2];
      if(Z2.lit && !Z2.out){
        isBurn=true;
        Z2.heat = Math.min(100, Z2.heat + ZONE_GROW*dt);
        B2.damage += DAMAGE_RATE*(Z2.heat/100)*dt;
        hottest = Math.max(hottest, Z2.heat);
        if(Math.random() < dt*Z2.heat*0.03)
          smokes.push({x:Z2.x+(Math.random()-0.5)*8, y:Z2.y-4, vx:(Math.random()-0.5)*8-4,
                       vy:-12-Math.random()*10, life:1.6+Math.random(), size:2+Math.random()*3});
      }
    }
    if(isBurn){
      burning.push(B2);
      B2.spread = (B2.spread||0) + dt;
      if(B2.spread > SPREAD_IN && hottest>55){
        B2.spread = 0;
        var fresh = B2.zones.filter(function(z){ return !z.lit && !z.out; });
        if(fresh.length){ var nz=pick(fresh); nz.lit=true; nz.heat=10; }
      }
      if(B2.damage>=100){ burnDown(B2); }
    }
  }

  computeFireDist();

  /* --- brannsjef: nye branner --- */
  levelTimer += dt;
  if(levelTimer>45){ levelTimer=0; level++; }
  var active = burning.length;
  var maxActive = (gameTime<40) ? 1 : Math.min(4, 2 + Math.floor(level/2));
  fireTimer -= dt;
  if(fireTimer<=0){
    fireTimer = Math.max(7, 16 - level*0.9) + Math.random()*4;
    if(active < maxActive) igniteRandom();
  }

  /* --- trafikk --- */
  var dayFactor = 1 - 0.45*darkAmount();       // roligere gater om natta
  trafficTarget = Math.max(3, Math.min(16, Math.round((8 + 5*Math.sin(gameTime/32) + Math.min(5,(level-1)*1.2))*dayFactor)));
  spawnT -= dt;
  if(spawnT<=0){
    spawnT = 1.1;
    if(cars.length < trafficTarget) spawnCar(false);
    else if(cars.length > trafficTarget+1) despawnFar();
  }
  updateCars(dt);

  updateParticles(dt);

  /* --- kamera --- */
  var tx = (viewW>=WORLD_W) ? (WORLD_W-viewW)/2 : Math.max(0, Math.min(WORLD_W-viewW, truck.x-viewW/2));
  var ty = (viewH>=WORLD_H) ? (WORLD_H-viewH)/2 : Math.max(0, Math.min(WORLD_H-viewH, truck.y-viewH/2));
  camX += (tx-camX)*Math.min(1, dt*12);
  camY += (ty-camY)*Math.min(1, dt*12);
}

function updateParticles(dt){
  for(var i=smokes.length-1;i>=0;i--){ var s=smokes[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy*=0.99; s.life-=dt; if(s.life<=0) smokes.splice(i,1); }
  for(var j=steams.length-1;j>=0;j--){ var t=steams[j]; t.y+=t.vy*dt; t.life-=dt; if(t.life<=0) steams.splice(j,1); }
  for(var k=texts.length-1;k>=0;k--){ var x=texts[k]; x.y-=8*dt; x.t-=dt; if(x.t<=0) texts.splice(k,1); }
  var smax=Math.round(200*partScale);
  if(smokes.length>smax) smokes.splice(0, smokes.length-smax);
}

function moveTruck(dx,dy){
  var nx = truck.x+dx;
  if(!blocked(nx, truck.y)) truck.x = nx; else truck.spd*=0.4;
  var ny = truck.y+dy;
  if(!blocked(truck.x, ny)) truck.y = ny; else truck.spd*=0.4;
  truck.x = Math.max(TRUCK_R, Math.min(WORLD_W-TRUCK_R, truck.x));
  truck.y = Math.max(TRUCK_R, Math.min(WORLD_H-TRUCK_R, truck.y));
}
function blocked(x,y){
  for(var i=0;i<buildings.length;i++){
    var b=buildings[i];
    if(x > b.x-B_PAD && x < b.x+b.w+B_PAD && y > b.y-B_PAD && y < b.y+b.h+B_PAD) return true;
  }
  return false;
}

/* ---------- tegning ---------- */
function render(){
  ctx = mainCtx;
  ctx.setTransform(1,0,0,1,0,0);
  // menyene og verdenslaget dekker hele flaten selv, saa vi slipper aa fylle den forst
  if(state==='menu'){ drawMenu(); return; }
  if(state==='help'){ drawHelp(); return; }
  if(state==='about'){ drawAbout(); return; }

  var sx = (shake>0) ? (Math.random()-0.5)*shake : 0;
  var sy = (shake>0) ? (Math.random()-0.5)*shake : 0;
  // Kameraet laa foer paa hele logiske piksler. Ved 78 px/s flyttet verden seg
  // 1 eller 2 piksler annenhver frame - altsaa 5 eller 10 skjermpiksler i rykk.
  // Naa tegnes verden med avrundet kamera, mens selve oppskaleringen forskyves
  // med restbroeken. Da ruller brettet jevnt uten aa miste skarpe piksler.
  var cxf = camX - sx, cyf = camY - sy;
  var cx = Math.floor(cxf), cy = Math.floor(cyf);
  var fx = Math.round((cxf-cx)*scale), fy = Math.round((cyf-cy)*scale);
  camPX = cx; camPY = cy;

  var vw = Math.ceil(viewW)+1, vh = Math.ceil(viewH)+1;
  lightW = vw; lightH = vh;
  if(!wcv){ wcv = document.createElement('canvas'); wcx = wcv.getContext('2d', {alpha:false}); }
  if(wcv.width!==vw || wcv.height!==vh){ wcv.width=vw; wcv.height=vh; }
  ctx = wcx;
  ctx.setTransform(1,0,0,1,-cx,-cy);
  ctx.fillStyle = P.grass2; ctx.fillRect(cx,cy,vw,vh);

  // bare den synlige biten av bakken
  var gx=Math.max(0,cx), gy=Math.max(0,cy);
  var gw=Math.min(WORLD_W,cx+vw)-gx, gh=Math.min(WORLD_H,cy+vh)-gy;
  if(gw>0 && gh>0) ctx.drawImage(ground, gx,gy,gw,gh, gx,gy,gw,gh);

  // brannposter
  for(var h=0; h<hydrants.length; h++){
    var H=hydrants[h];
    if(!inView(H.x-6,H.y-8,12,12)) continue;
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(H.x-3, H.y+2, 8, 3);
    ctx.fillStyle='#d02020'; ctx.fillRect(H.x-3, H.y-6, 6, 8);
    ctx.fillStyle='#f05050'; ctx.fillRect(H.x-3, H.y-6, 6, 2);
    ctx.fillStyle='#901010'; ctx.fillRect(H.x-5, H.y-4, 10, 2);
  }

  // gatelykter i kryssene
  for(var lj=0; lj<NODE_ROWS; lj++) for(var li=0; li<NODE_COLS; li++){
    var LN=nodeInfo[lj][li];
    if(LN.type!=='none') continue;                 // skiltede kryss har egne stolper
    if(!inView(LN.x+14,LN.y-19,8,12)) continue;
    ctx.fillStyle='#5a5a66'; ctx.fillRect(LN.x+16, LN.y-15, 2, 7);
    ctx.fillStyle = (darkAmount()>0.25) ? '#ffe9a0' : '#9aa0ac';
    ctx.fillRect(LN.x+15, LN.y-18, 4, 3);
  }

  // bensinpumper
  for(var fk=0; fk<FUEL_ST.length; fk++){
    var F=FUEL_ST[fk].court, py=Math.round(F.y+F.h*0.62);
    if(!inView(F.x,F.y-14,F.w,F.h+14)) continue;
    drawPump(Math.round(F.x+15), py);
    drawPump(Math.round(F.x+F.w-15), py);
  }

  // bygninger (sortert etter y for enkel dybde)
  for(var i=0;i<sortedBuildings.length;i++){
    var b = sortedBuildings[i];
    if(!inView(b.x-2,b.y-8,b.w+6,b.h+12)) continue;
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.fillRect(b.x+3, b.y+4, b.w, b.h);
    ctx.drawImage(b.sprite, Math.round(b.x), Math.round(b.y));
    if(!b.burned && b.damage>2){
      var w = Math.round(b.w*0.7), bx = Math.round(b.x+(b.w-w)/2), by = Math.round(b.y-6);
      ctx.fillStyle='#201820'; ctx.fillRect(bx-1, by-1, w+2, 5);
      var f = Math.min(1, b.damage/100);
      ctx.fillStyle = f>0.7 ? '#ff4020' : (f>0.4 ? '#ffa020' : '#ffe04a');
      ctx.fillRect(bx, by, Math.round(w*f), 3);
    }
  }

  drawTrafficLights();

  // roykpartikler under flammer
  for(var s=0;s<smokes.length;s++){
    var S=smokes[s], a=Math.max(0,Math.min(1,S.life/1.6));
    ctx.fillStyle='rgba(154,154,168,'+(a*0.65).toFixed(2)+')';
    var sz=Math.round(S.size||3);
    ctx.fillRect(Math.round(S.x)-sz, Math.round(S.y)-sz, sz*2, sz*2);
  }

  // flammer
  var t = performance.now()/1000;
  for(var k=0;k<buildings.length;k++){
    var B=buildings[k]; if(B.burned) continue;
    if(!inView(B.x-8,B.y-24,B.w+16,B.h+24)) continue;
    for(var z=0;z<B.zones.length;z++){
      var Z=B.zones[z];
      if(Z.out && !Z.lit){
        ctx.fillStyle='rgba(30,20,30,0.55)';
        ctx.fillRect(Math.round(Z.x)-4, Math.round(Z.y)-2, 8, 4);
        continue;
      }
      if(!Z.lit) continue;
      drawFlame(Math.round(Z.x), Math.round(Z.y), Z.heat, t+Z.seed);
    }
  }

  // vann
  for(var d=0; d<droplets.length; d++){
    var D=droplets[d];
    ctx.fillStyle = (d%3===0)? P.water2 : P.water;
    ctx.fillRect(Math.round(D.x), Math.round(D.y), 2, 2);
  }
  for(var e=0;e<steams.length;e++){
    var E=steams[e], al=Math.max(0,E.life/0.5);
    ctx.fillStyle='rgba(240,250,255,'+(al*0.8).toFixed(2)+')';
    ctx.fillRect(Math.round(E.x)-2, Math.round(E.y)-2, 4, 4);
  }

  var lit = buildLight(cx, cy);

  ctx = mainCtx;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(wcv, 0,0,vw,vh, -fx,-fy, vw*scale,vh*scale);

  // roterte sprites tegnes i full opplosning, ellers blir de grotete
  ctx.setTransform(scale,0,0,scale, -cxf*scale, -cyf*scale);
  drawCars();
  drawTruck();
  drawShift();

  // morket legges over alt, med mjuk overgang i lyskjeglene
  if(lit){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled = smoothLight;
    ctx.drawImage(lightCv, 0,0,vw,vh, -fx,-fy, vw*scale,vh*scale);
    ctx.imageSmoothingEnabled = false;
  }
  drawHUD();
}

// er dette rektangelet i det hele tatt synlig?
function inView(x,y,w,h){
  return x+w > camPX-6 && x < camPX+viewW+6 && y+h > camPY-6 && y < camPY+viewH+6;
}

// Morket legges som et lag over verden, med hull der det finnes lys.
var lightSprite=null;
function makeLightSprite(){
  var c=document.createElement('canvas'); c.width=64; c.height=64;
  var g2=c.getContext('2d');
  var gr=g2.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,   'rgba(0,0,0,1)');
  gr.addColorStop(0.5, 'rgba(0,0,0,0.6)');
  gr.addColorStop(1,   'rgba(0,0,0,0)');
  g2.fillStyle=gr; g2.fillRect(0,0,64,64);
  lightSprite=c;
}
function punch(lc,x,y,r,st){
  if(x < -r || y < -r || x > lc.canvas.width+r || y > lc.canvas.height+r) return;
  if(!lightSprite) makeLightSprite();
  lc.globalAlpha = st;
  lc.drawImage(lightSprite, x-r, y-r, r*2, r*2);
  lc.globalAlpha = 1;
}
function buildLight(cx, cy){
  var dk = darkAmount();
  if(dk <= 0.02) return false;
  var w=lightW, h=lightH;
  if(!lightCv){ lightCv=document.createElement('canvas'); lightCx=lightCv.getContext('2d'); }
  if(lightCv.width!==w || lightCv.height!==h){ lightCv.width=w; lightCv.height=h; }
  var lc=lightCx;
  lc.setTransform(1,0,0,1,0,0);
  lc.clearRect(0,0,w,h);
  lc.globalAlpha = 0.93*Math.pow(dk, 1.25);   // skumring mildt, natt nesten svart
  lc.fillStyle = darkColor();
  lc.fillRect(0,0,w,h);
  lc.globalAlpha = 1;
  lc.globalCompositeOperation='destination-out';

  var i;
  // gatelykter
  for(var nj=0; nj<NODE_ROWS; nj++) for(var ni=0; ni<NODE_COLS; ni++){
    var N=nodeInfo[nj][ni];
    punch(lc, N.x+20-cx, N.y-20-cy, 38+6*dk, 0.88);
  }
  // stasjoner
  punch(lc, STATION.apron.x+STATION.apron.w/2-cx, STATION.apron.y+STATION.apron.h/2-cy, 52, 0.8);
  for(i=0;i<FUEL_ST.length;i++){
    var FC=FUEL_ST[i].court;
    punch(lc, FC.x+FC.w/2-cx, FC.y+FC.h/2-cy, 46, 0.8);
  }
  // branner lyser opp
  for(i=0;i<buildings.length;i++){
    var B=buildings[i]; if(B.burned) continue;
    for(var z=0;z<B.zones.length;z++){
      var Z=B.zones[z]; if(!Z.lit || Z.out) continue;
      punch(lc, Z.x-cx, Z.y-cy, 24+Z.heat*0.34, 0.95);
    }
  }
  // billykter
  if(perfLevel < 2){
    for(i=0;i<cars.length;i++){
      var C=cars[i];
      punch(lc, C.x+C.hx*11-cx, C.y+C.hy*11-cy, 17, 0.8);
    }
  }
  // brannbilens lykter og blaalys
  punch(lc, truck.x-cx, truck.y-cy, 15+9*dk, 0.75);
  punch(lc, truck.x+Math.cos(truck.ang)*(20+6*dk)-cx, truck.y+Math.sin(truck.ang)*(20+6*dk)-cy, 34+16*dk, 0.97);
  if(truck.siren && (Math.floor(performance.now()/160)%2)===0)
    punch(lc, truck.x-cx, truck.y-cy, 30, 0.5);

  lc.globalCompositeOperation='source-over';
  return true;
}
function drawPerson(x,y,helmet,walk){
  x=Math.round(x); y=Math.round(y);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x-2,y+1,5,2);
  ctx.fillStyle='#2a3a6a'; ctx.fillRect(x-2,y-5,4,5);          // kropp
  ctx.fillStyle='#f0c8a0'; ctx.fillRect(x-1,y-7,2,2);          // ansikt
  ctx.fillStyle=helmet;    ctx.fillRect(x-2,y-9,4,2);          // hjelm
  ctx.fillStyle='#1a1a22';
  if((Math.floor(walk*10)%2)===0){ ctx.fillRect(x-2,y,1,2); ctx.fillRect(x+1,y,1,2); }
  else { ctx.fillRect(x-1,y,2,2); }
}
function drawShift(){
  if(shiftAnim<=0) return;
  var p = 1 - shiftAnim/3;
  var dx = STATION.bld.x + STATION.bld.w/2, dy = STATION.bld.y + STATION.bld.h + 3;
  var a = Math.min(1, p*1.7);
  var b = Math.max(0, Math.min(1, (p-0.3)*1.7));
  var oldHel = (crew==='dag') ? '#ffd23a' : '#bfe4ff';
  var newHel = (crew==='dag') ? '#bfe4ff' : '#ffd23a';
  drawPerson(truck.x + (dx-truck.x)*a, truck.y + (dy-truck.y)*a, oldHel, p*3);
  if(b>0) drawPerson(dx + (truck.x-dx)*b, dy + (truck.y-dy)*b, newHel, p*3);
}

function drawFlame(x,y,heat,t){
  var hgt = 4 + heat*0.15;
  var f = Math.sin(t*11)*0.5 + Math.sin(t*17.3)*0.3;
  var w = 3 + heat*0.05;
  ctx.fillStyle=P.fire1;
  ctx.fillRect(x-Math.round(w), y-Math.round(hgt*0.7+f), Math.round(w*2), Math.round(hgt*0.75));
  ctx.fillStyle=P.fire2;
  ctx.fillRect(x-Math.round(w*0.65), y-Math.round(hgt*0.95+f*1.4), Math.round(w*1.3), Math.round(hgt*0.8));
  ctx.fillStyle=P.fire3;
  ctx.fillRect(x-Math.round(w*0.35), y-Math.round(hgt*0.75+f), Math.round(w*0.7), Math.round(hgt*0.55));
  ctx.fillStyle='rgba(255,180,60,0.16)';
  ctx.fillRect(x-Math.round(w*2), y-Math.round(hgt), Math.round(w*4), Math.round(hgt*1.4));
}

function drawPump(x,y){
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(x-7,y-1,15,5);
  ctx.fillStyle='#d0d0da'; ctx.fillRect(x-8,y-3,15,4);        // pumpeoy
  ctx.fillStyle='#b6b6c2'; ctx.fillRect(x-8,y-3,15,1);
  ctx.fillStyle='#e8a020'; ctx.fillRect(x-4,y-12,8,10);       // pumpe
  ctx.fillStyle='#c47a10'; ctx.fillRect(x-4,y-12,8,1);
  ctx.fillStyle='#2a2a34'; ctx.fillRect(x-3,y-10,6,3);        // display
  ctx.fillStyle='#3ae05a'; ctx.fillRect(x-2,y-9,2,1);
  ctx.fillStyle='#8a8a96'; ctx.fillRect(x+4,y-8,2,5);         // slange
}
function drawCars(){
  for(var k=0;k<cars.length;k++){
    var C=cars[k];
    if(!inView(C.x-10,C.y-10,20,20)) continue;
    var ang=Math.atan2(C.hy, C.hx);
    ctx.save(); ctx.translate(Math.round(C.x), Math.round(C.y)); ctx.rotate(ang);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(-6,-3,14,7);
    ctx.fillStyle=C.col; ctx.fillRect(-7,-4,14,8);
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(-1,-3,5,6);
    ctx.fillStyle='#1a1a22'; ctx.fillRect(-6,-5,3,1); ctx.fillRect(-6,4,3,1);
    ctx.fillRect(3,-5,3,1); ctx.fillRect(3,4,3,1);
    ctx.fillStyle='#f8f0c0'; ctx.fillRect(7,-3,1,2); ctx.fillRect(7,1,1,2);
    if(C.brake){ ctx.fillStyle='#ff4028'; ctx.fillRect(-8,-4,1,3); ctx.fillRect(-8,1,1,3); }
    ctx.restore();
    if(C.mad>0){
      var mx=Math.round(C.x), my=Math.round(C.y)-13 - (C.mad>1.2?1:0);
      ctx.fillStyle='#ffe24a'; ctx.fillRect(mx-1,my,2,5); ctx.fillRect(mx-1,my+6,2,2);
      ctx.fillStyle='#e83820'; ctx.fillRect(mx-4,my-3,8,1);
    }
  }
}
function lamp(x,y,st){
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(x+1,y+1,4,10);
  ctx.fillStyle='#2a2a34'; ctx.fillRect(x,y,4,10);
  ctx.fillStyle = (st==='r') ? '#ff3020' : '#4a1a16'; ctx.fillRect(x+1,y+1,2,2);
  ctx.fillStyle = (st==='y') ? '#ffd23a' : '#4a3a10'; ctx.fillRect(x+1,y+4,2,2);
  ctx.fillStyle = (st==='g') ? '#3ae05a' : '#14401c'; ctx.fillRect(x+1,y+7,2,2);
}
function drawTrafficLights(){
  for(var k=0;k<LIGHTS.length;k++){
    var N=NI(LIGHTS[k][0], LIGHTS[k][1]); if(!N) continue;
    if(!inView(N.x-24,N.y-28,48,56)) continue;
    var ew=lightState(N,true), ns=lightState(N,false);
    lamp(N.x-19, N.y+14, ew);   // tilfart fra vest
    lamp(N.x+15, N.y-24, ew);   // tilfart fra ost
    lamp(N.x-19, N.y-24, ns);   // tilfart fra nord
    lamp(N.x+15, N.y+14, ns);   // tilfart fra sor
  }
}
function drawTruck(){
  var TR=truck;
  ctx.save();
  ctx.translate(Math.round(TR.x), Math.round(TR.y));
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(-9, -4, 20, 11);
  ctx.rotate(TR.ang);
  ctx.fillStyle=P.red;      ctx.fillRect(-11,-6, 22, 12);
  ctx.fillStyle=P.redDark;  ctx.fillRect(-11, 4, 22, 2); ctx.fillRect(-11,-6,22,1);
  ctx.fillStyle=P.white;    ctx.fillRect(-11, 1, 22, 2);
  ctx.fillStyle='#ea4a3a';  ctx.fillRect( 4,-6, 7, 12);
  ctx.fillStyle=P.glass;    ctx.fillRect( 8,-4, 3, 8);
  ctx.fillStyle=P.steel;    ctx.fillRect(-9,-3, 12, 5);
  ctx.fillStyle='#8e939c';  for(var r=-8;r<3;r+=3) ctx.fillRect(r,-3,1,5);
  ctx.fillStyle=P.black;
  ctx.fillRect(-8,-8,4,2); ctx.fillRect(-8,6,4,2); ctx.fillRect(4,-8,4,2); ctx.fillRect(4,6,4,2);
  if(TR.siren){
    var on = (Math.floor(performance.now()/160)%2)===0;
    ctx.fillStyle = on ? P.blue : '#102040'; ctx.fillRect(1,-6,3,2);
    ctx.fillStyle = on ? '#102040' : P.blue; ctx.fillRect(1, 4,3,2);
  } else { ctx.fillStyle='#2a3a6a'; ctx.fillRect(1,-6,3,2); ctx.fillRect(1,4,3,2); }
  ctx.restore();

  if(TR.mode==='hose'){
    ctx.save();
    ctx.translate(Math.round(TR.x), Math.round(TR.y));
    ctx.rotate(TR.aim);
    ctx.fillStyle='#f0d040'; ctx.fillRect(4,-2,7,4);
    ctx.fillStyle='#2a2a34'; ctx.fillRect(10,-1,3,2);
    ctx.restore();
    // siktemarkor
    var ax = TR.x+Math.cos(TR.aim)*HOSE_RANGE, ay = TR.y+Math.sin(TR.aim)*HOSE_RANGE;
    ctx.fillStyle='rgba(200,240,255,0.35)';
    ctx.fillRect(Math.round(ax)-3, Math.round(ay)-1, 6, 2);
    ctx.fillRect(Math.round(ax)-1, Math.round(ay)-3, 2, 6);
  }
}

/* ---------- HUD ---------- */
function w2s(x,y){ return {x:(x-camX)*scale/dpr, y:(y-camY)*scale/dpr}; }
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
var starSpr={};
function starSprite(filled){
  var key = filled?'1':'0';
  if(starSpr[key]) return starSpr[key];
  var r=13, pad=4, sz=(r+pad)*2;
  var c=document.createElement('canvas');
  c.width=Math.ceil(sz*dpr); c.height=Math.ceil(sz*dpr);
  var g2=c.getContext('2d');
  g2.setTransform(dpr,0,0,dpr,0,0);
  g2.beginPath();
  for(var i=0;i<10;i++){
    var a=-Math.PI/2 + i*Math.PI/5, rr=(i%2===0)?r:r*0.45;
    g2[i?'lineTo':'moveTo'](sz/2+Math.cos(a)*rr, sz/2+Math.sin(a)*rr);
  }
  g2.closePath();
  g2.fillStyle = filled ? '#ffd23a' : 'rgba(255,255,255,0.16)';
  g2.fill();
  g2.lineWidth=2; g2.strokeStyle = filled ? '#b07a10' : 'rgba(0,0,0,0.25)'; g2.stroke();
  starSpr[key]={c:c, s:sz}; return starSpr[key];
}
function star(x,y,r,filled){
  if(r===13){ var sp=starSprite(filled); ctx.drawImage(sp.c, x-sp.s/2, y-sp.s/2, sp.s, sp.s); return; }
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var a = -Math.PI/2 + i*Math.PI/5, rr = (i%2===0)? r : r*0.45;
    ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr, y+Math.sin(a)*rr);
  }
  ctx.closePath();
  ctx.fillStyle = filled ? '#ffd23a' : 'rgba(255,255,255,0.16)';
  ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle = filled ? '#b07a10' : 'rgba(0,0,0,0.25)'; ctx.stroke();
}
// Tekst med kontur er dyrt aa rasterisere hver frame. Hver unike tekst
// tegnes en gang til et lite lerret i skjermens egen opplosning og blittes etterpa.
var lblCache={}, lblKeys=[];
function labelSprite(text,size,col){
  var key=text+'|'+size+'|'+col;
  var sp=lblCache[key];
  if(sp) return sp;
  var font='bold '+size+'px "Courier New", ui-monospace, monospace';
  mainCtx.save(); mainCtx.setTransform(1,0,0,1,0,0); mainCtx.font=font;
  var tw=Math.ceil(mainCtx.measureText(text).width);
  mainCtx.restore();
  var pad=Math.ceil(size*0.35), w=tw+pad*2, h=Math.ceil(size*1.8);
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.ceil(w*dpr)); c.height=Math.max(1,Math.ceil(h*dpr));
  var g2=c.getContext('2d');
  g2.setTransform(dpr,0,0,dpr,0,0);
  g2.font=font; g2.textAlign='left'; g2.textBaseline='middle';
  g2.lineWidth=Math.max(3,size*0.22); g2.strokeStyle='rgba(12,12,20,0.85)';
  g2.strokeText(text,pad,h/2);
  g2.fillStyle=col; g2.fillText(text,pad,h/2);
  sp={c:c, w:w, h:h, tw:tw, pad:pad};
  if(lblKeys.length>140){ delete lblCache[lblKeys.shift()]; }
  lblKeys.push(key); lblCache[key]=sp;
  return sp;
}
function label(text,x,y,size,col,align){
  size=Math.round(size); col=col||'#ffffff';
  var sp=labelSprite(String(text),size,col);
  var dx = x - sp.pad;
  if(align==='center') dx = x - sp.tw/2 - sp.pad;
  else if(align==='right') dx = x - sp.tw - sp.pad;
  ctx.drawImage(sp.c, dx, y-sp.h/2, sp.w, sp.h);
}

var bannerFit={};
function banner(text, col, y, pulse){
  var key = text+'|'+Math.round(cssW);
  var fit = bannerFit[key];
  if(!fit){
    var size0 = Math.min(26, cssW*0.062);
    ctx.font='bold '+size0+'px "Courier New", ui-monospace, monospace';
    while(size0>10 && ctx.measureText(text).width > cssW*0.82){
      size0--; ctx.font='bold '+size0+'px "Courier New", ui-monospace, monospace';
    }
    fit = bannerFit[key] = {s:size0, w:ctx.measureText(text).width};
  }
  var size=fit.s, tw=fit.w;
  ctx.font='bold '+size+'px "Courier New", ui-monospace, monospace';
  var bw=tw+size*1.5, bh2=size*2.0, bx=(cssW-bw)/2;
  ctx.globalAlpha = pulse ? (0.74+0.26*Math.sin(performance.now()/260)) : 1;
  ctx.fillStyle='rgba(10,8,18,0.88)'; roundRect(bx,y,bw,bh2,10); ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle=col; ctx.stroke();
  ctx.globalAlpha=1;
  label(text, cssW/2, y+bh2/2, size, col, 'center');
}
function drawWarnings(){

function drawHUD(){
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // flytende tekst i verdensrom
  for(var i=0;i<texts.length;i++){
    var FT=texts[i], p=w2s(FT.x,FT.y);
    ctx.globalAlpha = Math.min(1, FT.t);
    label(FT.s, p.x, p.y, 13, FT.col, 'center');
    ctx.globalAlpha = 1;
  }

  // pilmarkorer mot branner utenfor skjermen
  for(var b=0;b<burning.length;b++){
    var B=burning[b];
    var p2 = w2s(B.x+B.w/2, B.y+B.h/2);
    if(p2.x>26 && p2.x<cssW-26 && p2.y>60 && p2.y<cssH-60) continue;
    var mx=cssW/2, my=cssH/2, dx=p2.x-mx, dy=p2.y-my, d=Math.hypot(dx,dy)||1;
    var rad = Math.min(cssW,cssH)*0.36;

    ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-8,-9); ctx.lineTo(-8,9); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // pil mot brannstasjonen naar vakta skal byttes
  if(shiftDue && shiftAnim<=0){
    var ps = w2s(STATION.apron.x+STATION.apron.w/2, STATION.apron.y+STATION.apron.h/2);
    if(ps.x<26 || ps.x>cssW-26 || ps.y<60 || ps.y>cssH-60){

      var pf = w2s(nf.x, nf.y);

        ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(-7,-8); ctx.lineTo(-7,8); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }

  // stjerner
  for(var s=0;s<3;s++) star(30+s*30, 30, 13, s<stars);
  // poeng
  label(String(score), cssW/2, 28, 22, '#ffffff', 'center');

  // klokke og hvem som er paa vakt
  var ph=phaseNow();
  var phCol = ph==='natt' ? '#9fb8ff' : (ph==='dag' ? '#ffe9a0' : '#ffb070');
  var helCol = (crew==='dag') ? '#ffd23a' : '#bfe4ff';

  if(shiftAnim>0) label(T('shifting'), cssW/2, 70, 12, '#ffd23a', 'center');

  var bw = Math.min(150, cssW*0.34), bx = 22, by = 56;
  ctx.fillStyle='rgba(10,10,18,0.65)'; roundRect(bx-4,by-4,bw+8,20,6); ctx.fill();
  ctx.fillStyle='#1c2a3a'; roundRect(bx,by,bw,12,4); ctx.fill();
  var wf = truck.water/TANK_MAX;
  ctx.fillStyle = wf<0.18 ? '#ff5a4a' : P.water; roundRect(bx,by,Math.max(3,bw*wf),12,4); ctx.fill();
  label(T('water'), bx+6, by+6, 10, '#e8f6ff');
  if(truck.refill) label(T('fillWater'), bx+bw+12, by+6, 11, '#8ef08e');

  // bensin
  var fy = by+18;
  ctx.fillStyle='rgba(10,10,18,0.65)'; roundRect(bx-4,fy-4,bw+8,20,6); ctx.fill();
  ctx.fillStyle='#2a2418'; roundRect(bx,fy,bw,12,4); ctx.fill();
  var ff = truck.fuel/FUEL_MAX;
  var low = ff<0.3 && (Math.floor(performance.now()/300)%2)===0;
  ctx.fillStyle = ff<0.3 ? (low?'#ff5a4a':'#c8502a') : '#e8a020';
  roundRect(bx,fy,Math.max(3,bw*ff),12,4); ctx.fill();
  label(T('fuel'), bx+6, fy+6, 10, '#fff0d8');

  if(practice) label(T('practiceTag'), bx, fy+26, 11, '#8ef08e');

  // knapper
  drawButton(btnSiren, truck.siren?'#ffd23a':'#6a6a78', truck.siren?'#3a2e00':'#1a1a22', T('btnSiren'));
  var near = nearestFireDist() < 140;
  drawButton(btnAction, truck.mode==='drive' ? (near?'#ff5a3a':'#d84a30') : '#3a9ad8', '#ffffff',
             truck.mode==='drive' ? T('btnSpray') : T('btnDrive'), near && truck.mode==='drive');
  drawSound(); drawFlip();
  if(state==='play') drawQuit();

  // joystick
  if(stick.active){
    ctx.fillStyle='rgba(255,255,255,0.14)';
    ctx.beginPath(); ctx.arc(stick.cx, stick.cy, 46, 0, 6.3); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle = truck.mode==='hose' ? 'rgba(88,200,248,0.9)' : 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(stick.cx+stick.dx, stick.cy+stick.dy, 20, 0, 6.3); ctx.fill();
  } else if(touchUI && state==='play' && !confirmQuit){
    var hm = stickHome();
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(hm.x, hm.y, 46, 0, 6.3); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.32)';
    ctx.beginPath(); ctx.arc(hm.x, hm.y, 20, 0, 6.3); ctx.fill();
  }

  // hjelpetekst
  if(hint>0){

    ctx.globalAlpha=1;
  }
  drawWarnings();
  if(truck.mode==='hose'){
    label(shiftDue ? T('noCrew') : T('hose'),
          cssW/2, cssH-18, 12, shiftDue?'#ffd23a':'#9fdcff', 'center');
  }
  if(confirmQuit && state==='play') drawConfirm();
  if(state==='over') drawOver();
}

function nearestFireDist(){ return fireDistC; }
function computeFireDist(){
  var best=1e18;
  for(var i=0;i<burning.length;i++){
    var b=burning[i];
    for(var z=0;z<b.zones.length;z++){
      var Z=b.zones[z]; if(!Z.lit||Z.out) continue;
      var dx=truck.x-Z.x, dy=truck.y-Z.y, d2=dx*dx+dy*dy;
      if(d2<best) best=d2;
    }
  }
  fireDistC = (best>1e17) ? 1e9 : Math.sqrt(best);
}

    ctx.beginPath(); ctx.arc(b.x,b.y,b.r+10*g,0,6.3); ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.arc(b.x, b.y+4, b.r, 0, 6.3); ctx.fill();
  ctx.fillStyle=fill;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.3); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.arc(b.x, b.y-b.r*0.35, b.r*0.72, Math.PI, 0); ctx.fill();

  var s=Math.max(8,Math.round(size));
  ctx.font='bold '+s+'px "Courier New", ui-monospace, monospace';
  while(s>8 && ctx.measureText(text).width>maxW){ s--; ctx.font='bold '+s+'px "Courier New", ui-monospace, monospace'; }

}

function drawIcon(kind,x,y){
  ctx.save(); ctx.translate(x,y);

    ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.arc(0,0,13,0,6.3); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(4,-3,6,0,6.3); ctx.fill();
  } else if(kind==='hose'){
    ctx.fillStyle='#f0d040'; ctx.fillRect(-12,-3,10,6);
    ctx.fillStyle='#2a2a34'; ctx.fillRect(-3,-2,4,4);
    ctx.fillStyle=P.water; ctx.fillRect(3,-2,3,3); ctx.fillRect(8,-4,3,3); ctx.fillRect(12,1,3,3);
  } else if(kind==='flame'){
    ctx.scale(1.5,1.5); ctx.translate(0,7); drawFlameUI(0,0,90,performance.now()/1000);
  } else if(kind==='hydrant'){
    ctx.fillStyle='#d02020'; ctx.fillRect(-4,-9,8,13);
    ctx.fillStyle='#f05050'; ctx.fillRect(-4,-9,8,3);
    ctx.fillStyle='#901010'; ctx.fillRect(-7,-5,14,3);
  } else if(kind==='star'){
    star(0,0,12,true);
  } else if(kind==='shift'){
    ctx.fillStyle='#ffd23a'; ctx.fillRect(-10,-8,7,3); ctx.fillRect(-9,-11,5,3);
    ctx.fillStyle='#2a3a6a'; ctx.fillRect(-10,-5,6,7);
    ctx.fillStyle='#bfe4ff'; ctx.fillRect(4,-8,7,3); ctx.fillRect(5,-11,5,3);
    ctx.fillStyle='#2a3a6a'; ctx.fillRect(4,-5,6,7);
    ctx.fillStyle='#9a92b0'; ctx.fillRect(-2,-2,5,1); ctx.fillRect(-2,3,5,1);
  } else if(kind==='fuel'){
    ctx.fillStyle='#d0d0da'; ctx.fillRect(-10,6,20,4);
    ctx.fillStyle='#e8a020'; ctx.fillRect(-5,-10,10,15);
    ctx.fillStyle='#2a2a34'; ctx.fillRect(-3,-8,6,4);
    ctx.fillStyle='#3ae05a'; ctx.fillRect(-2,-7,2,2);
    ctx.fillStyle='#8a8a96'; ctx.fillRect(5,-5,3,7);
  } else if(kind==='light'){
    ctx.fillStyle='#2a2a34'; ctx.fillRect(-4,-11,8,22);
    ctx.fillStyle='#ff3020'; ctx.fillRect(-2,-9,4,4);
    ctx.fillStyle='#4a3a10'; ctx.fillRect(-2,-2,4,4);
    ctx.fillStyle='#14401c'; ctx.fillRect(-2,5,4,4);
  } else if(kind==='siren'){
    var on=(Math.floor(performance.now()/300)%2)===0;
    ctx.fillStyle='#8a1818'; ctx.fillRect(-11,0,22,7);
    ctx.fillStyle=on?P.blue:'#20305a'; ctx.fillRect(-8,-6,6,6);
    ctx.fillStyle=on?'#20305a':P.blue; ctx.fillRect(2,-6,6,6);
  }
  ctx.restore();
}

var aboutBtns=[];
function drawAbout(){
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var lines = [

    {t:T('lic1'),            s:13, c:'#f0d8c0', g:1.3},
    {t:T('lic2'),          s:13, c:'#f0d8c0', g:1.3},

  }

  var bw = Math.min(220, cssW*0.6), bx=(cssW-bw)/2, by = cssH-bh-Math.max(18,cssH*0.04);
  aboutBtns=[{x:bx,y:by,w:bw,h:bh}];
  ctx.fillStyle='rgba(0,0,0,0.4)'; roundRect(bx,by+4,bw,bh,12); ctx.fill();

var overBtns=[];

  ctx.fillStyle='rgba(10,8,16,0.78)'; ctx.fillRect(0,0,cssW,cssH);
  label(T('overTitle'), cssW/2, cssH*0.28, Math.min(28, cssW*0.07), '#ff8a5a', 'center');

  overBtns=[{x:bx,y:by,w:bw,h:bh,t:T('again'),a:'again'},
            {x:bx,y:by+bh+14,w:bw,h:bh,t:T('menu'),a:'menu'}];
  for(var i=0;i<overBtns.length;i++){
    var B=overBtns[i];

      if(B.a==='again') startGame(practice); else { state='menu'; }
      return;
    }
  }

/* ---------- lokke med fast tidssteg ---------- */
var acc=0, last=performance.now(), needRedraw=true;

/* ---------- automatisk ytelsesnivaa ----------
   Nivaa 0: full skarphet. 1: lavere pikselforhold. 2: i tillegg hardere
   sparing paa lys og partikler. Justeres opp igjen naar maskinen henger med. */
var perfLevel=0, dprCap=3, perfSum=0, perfN=0, perfGood=0, smoothLight=true, partScale=1;
var avgFrameMs=16.7;
function applyPerf(){
  dprCap      = (perfLevel===0) ? 3 : 2;
  smoothLight = (perfLevel < 2);
  partScale   = (perfLevel < 2) ? 1 : 0.55;
  layout();
}
function perfSample(ms){
  perfSum += ms; perfN++;
  if(perfN < 45) return;
  var avg = perfSum/perfN; perfSum=0; perfN=0;
  avgFrameMs = avg;
  if(avg > 21 && perfLevel < 2){ perfLevel++; perfGood=0; applyPerf(); }
  else if(avg < 13){ if(++perfGood >= 10 && perfLevel > 0){ perfLevel--; perfGood=0; applyPerf(); } }
  else perfGood = 0;
}
function frame(now){
  var d=(now-last)/1000; last=now;
  if(!(d>0)) d=0;
  if(d>0.25) d=0.25;
  // Naar skjermen ligger tett opptil et helt antall logikksteg, laas frametiden
  // til det. Ellers gir avrundingsstoy en og annen frame uten steg, og da staar
  // brettet stille i 16 ms for saa aa hoppe dobbelt - det synes godt naar man ruller.
  var kk = d/STEP, kr = Math.round(kk);
  if(kr>=1 && kr<=4 && Math.abs(kk-kr) < 0.25) d = kr*STEP;
  perfSample(d*1000);
  acc+=d; var steps=0;
  while(acc>=STEP && steps<3){ update(STEP); acc-=STEP; steps++; }
  if(acc>STEP*3) acc=0;
  // logikken gaar i 60 Hz. Paa 120 Hz-skjermer er annenhver frame identisk,
  // saa vi hopper over den i stedet for aa tegne det samme bildet en gang til.
  if(steps>0 || needRedraw || avgFrameMs>=12){ needRedraw=false; render(); }
  requestAnimationFrame(frame);
}

try{ if(/venstre|hand=v/i.test((location.hash||'')+(location.search||''))) leftHanded=true; }catch(err){}
lang = detectLang();
try{ document.documentElement.lang = lang; }catch(err){}
layout();
truck = {x:0,y:0,ang:0,spd:0,mode:'drive',aim:0,water:TANK_MAX,siren:false,spraying:false,refill:0};
ground = null;
requestAnimationFrame(frame);

})();
